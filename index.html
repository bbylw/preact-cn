<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Preact 技术刊物：4kB 的虚拟 DOM、可观测的 diff 过程、可插拔的渲染调度器、服务端渲染与补水，以及 preact/compat 兼容层。"
    />
    <meta name="theme-color" content="#f4f3ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Preact · 4kB 的虚拟 DOM</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('preact-cn-theme');
          var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      /* 首屏关键样式内联：外部 CSS 到达前也不让跳转链接闪现 */
      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 100;
        padding: 10px 16px;
        border-radius: 8px;
        background: #5c34a6;
        color: #fff;
        font: 500 14px/1.4 system-ui, sans-serif;
        transform: translateY(-160%);
      }
      .skip-link:focus {
        transform: none;
      }

      .boot {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f4f3ef;
        color: #17181c;
      }
      .boot__mark {
        width: 40px;
        height: 40px;
        fill: #5c34a6;
      }
      .boot__name {
        font: 600 18px/1 'Space Grotesk Variable', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        letter-spacing: -0.03em;
      }
      .boot__line {
        width: 128px;
        height: 2px;
        overflow: hidden;
        background: #d6d3ca;
      }
      .boot__line i {
        display: block;
        width: 38%;
        height: 100%;
        background: #5c34a6;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot__note {
        font: 400 11px/1 'JetBrains Mono Variable', ui-monospace, monospace;
        letter-spacing: 0.08em;
        color: #6a6d75;
      }
      html[data-theme='dark'] .boot {
        background: #121317;
        color: #f0efe9;
      }
      html[data-theme='dark'] .boot__mark {
        fill: #b49aee;
      }
      html[data-theme='dark'] .boot__line {
        background: #33363e;
      }
      html[data-theme='dark'] .boot__line i {
        background: #b49aee;
      }
      html[data-theme='dark'] .boot__note {
        color: #8b8e97;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__line i {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <div class="scroll-progress" aria-hidden="true"><span class="scroll-progress__bar"></span></div>
    <div id="app">
      <div class="boot" aria-hidden="true">
        <svg class="boot__mark" viewBox="0 0 32 32">
          <path d="M16 3 29 10v12L16 29 3 22V10L16 3Zm0 3.6L6.4 12l9.6 5.5 9.6-5.5L16 6.6ZM5.4 14.5v7.3l9.6 5.5v-7.3l-9.6-5.5Zm11.2 12.8 9.6-5.5v-7.3l-9.6 5.5v7.3Z" />
        </svg>
        <span class="boot__name">Preact</span>
        <span class="boot__line"><i></i></span>
        <span class="boot__note">装载 4kB 运行时</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
